<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | PAK</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="https://i.ibb.co/DD7QKDFV/2-D42-C2-F9-9-A7-A-4921-8-E6-E-CA17-A6-A873-E0.jpg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --black: #0d0d0d;
      --dark: #1a1a1a;
      --red: #c41e3a;
      --white: #f5f5f5;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      line-height: 1.5;
    }
    header {
      background: var(--dark);
      border-bottom: 3px solid var(--red);
      padding: 14px 18px;
    }
    .nav-inner {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-inner a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 18px 50px;
      text-align: center;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 8px;
      color: #c9b6ff;
    }
    .sub {
      color: #888;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px 20px;
      margin-bottom: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-claim { background: var(--red); }
    .btn-kewangan { background: #2e7d32; }
    .btn:hover { opacity: 0.92; }
    footer {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<header>
  <div class="nav-inner">
    <a href="/">← Laman Utama</a>
    <span style="font-weight:700;">Admin</span>
  </div>
</header>

<div class="wrap">
  <h1>Panel Admin PAK</h1>
  <p class="sub">Pilih halaman</p>

  <a href="/claim/" class="btn btn-claim">📝 Resit Rasmi (/claim)</a>
  <a href="/kewangan/" class="btn btn-kewangan">📊 Kewangan (/kewangan)</a>
</div>

<footer>
  © 2026 Pertubuhan Aktivis Keusahawanan (PAK)
</footer>

</body>
</html>
