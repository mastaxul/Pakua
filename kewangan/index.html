<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kewangan | PAKUA Selangor & PAK</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="https://i.ibb.co/DD7QKDFV/2-D42-C2-F9-9-A7-A-4921-8-E6-E-CA17-A6-A873-E0.jpg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --black: #0d0d0d;
      --dark: #1a1a1a;
      --red: #c41e3a;
      --green: #2e7d32;
      --white: #f5f5f5;
      --light: #e0e0e0;
      --gold: #d4af37;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--black);
      color: var(--white);
      line-height: 1.5;
      min-height: 100vh;
    }
    header {
      background: var(--dark);
      border-bottom: 3px solid var(--red);
      padding: 14px 18px;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .nav-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .nav-inner a {
      color: var(--white);
      text-decoration: none;
      font-weight: 600;
    }
    .nav-inner a:hover { color: var(--red); }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 50px;
    }
    h1 {
      text-align: center;
      font-size: 1.6rem;
      margin-bottom: 6px;
    }
    .sub {
      text-align: center;
      color: var(--light);
      margin-bottom: 24px;
      font-size: 0.95rem;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }
    .card {
      background: var(--dark);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 16px 12px;
      text-align: center;
    }
    .card .label { font-size: 0.8rem; color: #aaa; margin-bottom: 6px; }
    .card .value { font-size: 1.15rem; font-weight: 700; }
    .card.masuk .value { color: #4caf50; }
    .card.keluar .value { color: var(--red); }
    .card.baki .value { color: var(--gold); }
    .panel {
      background: var(--dark);
      border: 1px solid #333;
      border-radius: 14px;
      padding: 22px 18px;
    }
    .panel h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      text-align: center;
    }
    label {
      display: block;
      font-size: 0.9rem;
      margin: 12px 0 6px;
      color: var(--light);
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #111;
      color: var(--white);
      font-size: 1rem;
    }
    textarea { resize: vertical; min-height: 70px; }
    small { display: block; color: #888; font-size: 0.8rem; margin-top: 4px; }
    .btn {
      display: inline-block;
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      color: white;
    }
    .btn-save { background: var(--red); }
    .btn-print {
      background: #333;
      border: 1px solid #555;
      margin-top: 10px;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #msg {
      text-align: center;
      margin-top: 14px;
      min-height: 24px;
      font-size: 0.95rem;
    }
    .preview {
      margin-top: 10px;
      max-width: 180px;
      border-radius: 8px;
      display: none;
      border: 1px solid #444;
    }
    .pass-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .pass-row input {
      flex: 1;
    }
    .pass-row .btn-save {
      width: auto;
      margin-top: 0;
      min-width: 140px;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    .actions .btn { width: auto; flex: 1; margin-top: 0; }
    @media (max-width: 600px) {
      .cards { grid-template-columns: 1fr; }
      .pass-row {
        flex-direction: column;
        align-items: stretch;
      }
      .pass-row .btn-save {
        width: 100%;
      }
    }
    @media print {
      header, .no-print { display: none !important; }
      body { background: white; color: black; }
      .panel { border: 1px solid #ccc; }
    }
  </style>
</head>
<body>

  <header class="no-print">
    <div class="nav-inner">
      <a href="/">← Laman Utama</a>
      <a href="/pak/">Mini App</a>
    </div>
  </header>

  <div class="wrap">
    <h1>Dashboard Kewangan</h1>
    <p class="sub">Pertubuhan Aktivis Keusahawanan (PAK)</p>

    <div class="cards no-print">
      <div class="card masuk">
        <div class="label">Duit Masuk</div>
        <div class="value" id="sumMasuk">—</div>
      </div>
      <div class="card keluar">
        <div class="label">Duit Keluar</div>
        <div class="value" id="sumKeluar">—</div>
      </div>
      <div class="card baki">
        <div class="label">Baki</div>
        <div class="value" id="sumBaki">—</div>
      </div>
    </div>

    <div class="panel">
      <h2>Borang Rekod Kewangan</h2>

      <form id="borangKewangan">
        <label>Tarikh</label>
        <input type="date" id="tarikh" required>

        <label>Masa</label>
        <input type="time" id="masa" required>

        <label>Cara Bayar</label>
        <select id="caraBayar" required>
          <option value="">-- Pilih --</option>
          <option value="Bank">Bank</option>
          <option value="Tunai">Tunai</option>
        </select>

        <label>Kategori</label>
        <select id="kategori" required>
          <option value="">-- Pilih --</option>
          <option>Yuran</option>
          <option>Sumbangan</option>
          <option>Tajaan</option>
          <option>Geran</option>
          <option>Jualan</option>
          <option>Program</option>
          <option>Makanan & Minuman</option>
          <option>Pengangkutan</option>
          <option>Sewa</option>
          <option>Alat Tulis</option>
          <option>Peralatan</option>
          <option>Utiliti</option>
          <option>Elaun</option>
          <option>Runcit</option>
          <option>Lain-lain</option>
        </select>

        <label>Keterangan</label>
        <textarea id="keterangan" required placeholder="Contoh: Bayaran yuran ahli / Belanja program"></textarea>

        <label>Jumlah (RM)</label>
        <input type="number" id="jumlah" step="0.01" min="0" required>

        <label>Pembayar / Penerima</label>
        <input type="text" id="pembayarPenerima" required>

        <label>Jenis Transaksi</label>
        <select id="jenis" required>
          <option value="">-- Pilih --</option>
          <option value="Duit Masuk">Duit Masuk</option>
          <option value="Duit Keluar">Duit Keluar</option>
        </select>

        <label>Nombor Resit</label>
        <input type="text" id="noResit" placeholder="Contoh: R-001">

        <label>Bukti Transaksi (gambar resit)</label>
        <input type="file" id="buktiFile" accept="image/*" class="no-print">
        <small>Gambar akan diupload ke ImgBB automatik</small>
        <img id="buktiPreview" class="preview" alt="Preview resit">
        <input type="hidden" id="buktiUrl">

        <label>Penama Key-in</label>
        <input type="text" id="penama" required placeholder="Nama anda">

        <label>Password Admin</label>
        <div class="pass-row">
          <input type="password" id="password" placeholder="Masukkan password" autocomplete="off">
          <button type="submit" class="btn btn-save" id="btnSimpan" disabled>
            Simpan Rekod
          </button>
        </div>
        <small>Masukkan password betul untuk aktifkan butang simpan</small>
      </form>

      <p id="msg"></p>

      <div class="actions no-print">
        <button type="button" class="btn btn-print" onclick="window.print()">🖨️ Print</button>
        <button type="button" class="btn btn-print" onclick="sharePage()">📤 Share</button>
      </div>
    </div>
  </div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxpvotU6UMQSpmxcdKVTQs4Eoi-rDZf-sXLWOfQRsf0ntY8kNnwQUHz9SbpsDhjG03n/exec";
  const IMGBB_KEY = "5dde53aa49e23970db10b1af62fff130";
  const ADMIN_PASSWORD = "3281";

  document.getElementById("tarikh").value = new Date().toISOString().slice(0, 10);
  document.getElementById("masa").value = new Date().toTimeString().slice(0, 5);

  const passwordInput = document.getElementById("password");
  const btnSimpan = document.getElementById("btnSimpan");

  function semakPassword() {
    if (passwordInput.value === ADMIN_PASSWORD) {
      btnSimpan.disabled = false;
    } else {
      btnSimpan.disabled = true;
    }
  }
  passwordInput.addEventListener("input", semakPassword);

  document.getElementById("buktiFile").addEventListener("change", async function () {
    const file = this.files[0];
    const msg = document.getElementById("msg");
    const preview = document.getElementById("buktiPreview");
    const buktiUrl = document.getElementById("buktiUrl");

    buktiUrl.value = "";
    preview.style.display = "none";
    if (!file) return;

    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";

    msg.textContent = "⏳ Memuat naik resit ke ImgBB...";
    btnSimpan.disabled = true;

    try {
      const formData = new FormData();
      formData.append("image", file);

      const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {
        method: "POST",
        body: formData
      });
      const json = await res.json();

      if (json.success) {
        buktiUrl.value = json.data.display_url || json.data.url;
        msg.textContent = "✅ Resit berjaya dimuat naik";
      } else {
        msg.textContent = "❌ Gagal upload resit. Cuba lagi.";
      }
    } catch (e) {
      msg.textContent = "❌ Ralat upload resit.";
    }

    semakPassword();
  });

  document.getElementById("borangKewangan").addEventListener("submit", async function (e) {
    e.preventDefault();
    const msg = document.getElementById("msg");

    if (passwordInput.value !== ADMIN_PASSWORD) {
      msg.textContent = "❌ Password salah. Tidak boleh simpan.";
      return;
    }

    msg.textContent = "⏳ Menyimpan rekod...";
    btnSimpan.disabled = true;

    const payload = {
      tarikh: document.getElementById("tarikh").value,
      masa: document.getElementById("masa").value,
      caraBayar: document.getElementById("caraBayar").value,
      kategori: document.getElementById("kategori").value,
      keterangan: document.getElementById("keterangan").value,
      jumlah: document.getElementById("jumlah").value,
      pembayarPenerima: document.getElementById("pembayarPenerima").value,
      jenis: document.getElementById("jenis").value,
      noResit: document.getElementById("noResit").value,
      buktiUrl: document.getElementById("buktiUrl").value,
      penama: document.getElementById("penama").value
    };

    try {
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });

      msg.textContent = "✅ Rekod berjaya disimpan!";
      document.getElementById("borangKewangan").reset();
      document.getElementById("buktiUrl").value = "";
      document.getElementById("buktiPreview").style.display = "none";
      document.getElementById("tarikh").value = new Date().toISOString().slice(0, 10);
      document.getElementById("masa").value = new Date().toTimeString().slice(0, 5);
      passwordInput.value = "";
      semakPassword();
    } catch (err) {
      msg.textContent = "❌ Gagal menyimpan. Semak sambungan.";
      semakPassword();
    }
  });

  function sharePage() {
    const url = window.location.href;
    if (navigator.share) {
      navigator.share({ title: "Kewangan PAK", url: url });
    } else {
      navigator.clipboard.writeText(url);
      document.getElementById("msg").textContent = "🔗 Link disalin!";
    }
  }
</script>
</body>
</html>
